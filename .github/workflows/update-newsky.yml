name: Update NewSky traffic B

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsky-snapshots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Update snapshots
        shell: bash
        env:
          NEWSKY_COOKIE: ${{ secrets.NEWSKY_COOKIE }}
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import math
          import os
          import random
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          SNAP = Path('snapshot.json')
          PREV = Path('snapshot_prev.json')
          WORKERS = 16
          RETRIES = 4
          MAX_STALE = 10
          cookie = os.environ.get('NEWSKY_COOKIE', '').strip()
          if cookie.lower().startswith('cookie:'):
              cookie = cookie.partition(':')[2].strip()
          if not cookie:
              raise RuntimeError('NEWSKY_COOKIE is missing')

          def quota(headers):
              try:
                  return (int(headers['X-Rate-Limit-Remaining']), int(headers['X-Rate-Limit-Reset']), int(headers['X-Rate-Limit-Limit']))
              except (KeyError, ValueError, TypeError):
                  return None

          def error_text(response):
              try:
                  body = response.read(512).decode('utf-8', errors='replace').replace('\n', ' ')
                  return body.replace(cookie, '[hidden]')[:250]
              except Exception:
                  return ''

          def request_airport(icao):
              url = f'https://newsky.app/api/airport/{icao}'
              req = Request(url, headers={
                  'Accept': 'application/json',
                  'User-Agent': 'Mozilla/5.0',
                  'Referer': f'https://newsky.app/airport/{icao}',
                  'Cookie': cookie,
              })
              for attempt in range(RETRIES):
                  try:
                      with urlopen(req, timeout=35) as response:
                          return ('ok', json.load(response), quota(response.headers), '')
                  except HTTPError as exc:
                      limits = quota(exc.headers)
                      body = error_text(exc)
                      if exc.code in (400, 404):
                          return ('missing', None, limits, f'HTTP {exc.code}: {body}')
                      if exc.code in (401, 403):
                          raise RuntimeError(f'{icao}: HTTP {exc.code}: {body}. Check NEWSKY_COOKIE') from exc
                      if exc.code == 429:
                          reset = limits[1] if limits else int(time.time() + 60)
                          retry_after = exc.headers.get('Retry-After')
                          if retry_after:
                              try:
                                  reset = max(reset, int(time.time() + float(retry_after)))
                              except ValueError:
                                  pass
                          return ('limited', None, (0, reset, limits[2] if limits else 200), body)
                      if exc.code not in (408, 500, 502, 503, 504) or attempt == RETRIES - 1:
                          raise RuntimeError(f'{icao}: HTTP {exc.code}: {body}') from exc
                  except (URLError, TimeoutError, ConnectionError, json.JSONDecodeError) as exc:
                      if attempt == RETRIES - 1:
                          raise RuntimeError(f'{icao}: {type(exc).__name__}: {exc}') from exc
                  time.sleep(min(2 ** attempt, 8) + random.random() * 0.5)
              raise RuntimeError(f'{icao}: failed after retries')

          def get_probe(icao):
              for _ in range(6):
                  status, data, limits, error = request_airport(icao)
                  if status == 'ok':
                      if limits is None:
                          raise RuntimeError('NewSky did not return quota headers')
                      return data, limits
                  if status != 'limited':
                      raise RuntimeError(f'Validation probe {icao}: {error}')
                  wait_until(limits[1])
              raise RuntimeError(f'{icao}: API quota unavailable')

          def wait_until(reset):
              seconds = max(1.0, reset - time.time() + 1.0)
              print(f'Waiting {seconds:.1f}s for API reset', flush=True)
              time.sleep(seconds)

          def convert(icao, raw, old):
              if not isinstance(raw, dict) or raw.get('icao', '').upper() != icao:
                  raise ValueError(f'{icao}: bad airport response')
              b = (raw.get('traffic') or {}).get('B')
              if not isinstance(b, dict):
                  raise ValueError(f'{icao}: missing traffic.B')
              loc = raw.get('location') or {}
              lat, lon = loc.get('lat'), loc.get('lon')
              if not all(isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(v) for v in (lat, lon)):
                  raise ValueError(f'{icao}: invalid coordinates')
              out = {
                  'icao': icao,
                  'name': raw.get('name') or old.get('name') or icao,
                  'city': raw.get('city') or old.get('city') or '',
                  'country': raw.get('country') or old.get('country') or '',
                  'lat': lat,
                  'lon': lon,
                  'is_ua': raw.get('countryCode') == 'UA' or bool(old.get('is_ua')),
              }
              for kind in ('pax', 'cargo'):
                  source = b.get(kind)
                  directions = source.get('directions') if isinstance(source, dict) else None
                  if not isinstance(directions, list) or len(directions) != 12:
                      raise ValueError(f'{icao}: B.{kind} needs 12 directions')
                  sectors = []
                  for direction in directions:
                      c, n, bias = (direction.get(k) for k in ('current', 'normal', 'bias'))
                      if not all(isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(v) for v in (c, n, bias)):
                          raise ValueError(f'{icao}: invalid B.{kind}')
                      if c < 0 or n < 0:
                          raise ValueError(f'{icao}: negative demand')
                      sectors.append({'c': c, 'n': n, 'b': bias})
                  out[kind] = {'sectors': sectors}
              return out

          def retained(old, icao):
              for kind in ('pax', 'cargo'):
                  sectors = (old.get(kind) or {}).get('sectors')
                  if not isinstance(sectors, list) or len(sectors) != 12:
                      raise RuntimeError(f'{icao}: cannot retain old airport data')
              return {**old, 'stale': True}

          def geometry(a, b):
              p1, p2 = math.radians(a['lat']), math.radians(b['lat'])
              dp = p2 - p1
              dl = math.radians(b['lon'] - a['lon'])
              h = math.sin(dp / 2)**2 + math.cos(p1) * math.cos(p2) * math.sin(dl / 2)**2
              nm = 3440.065 * 2 * math.asin(min(1, math.sqrt(max(0, h))))
              y = math.sin(dl) * math.cos(p2)
              x = math.cos(p1) * math.sin(p2) - math.sin(p1) * math.cos(p2) * math.cos(dl)
              bearing = (math.degrees(math.atan2(y, x)) + 360) % 360
              return round(nm), int((bearing + 15) // 30) % 12

          def build_routes(old_routes, airports):
              new_routes = []
              for route in old_routes:
                  src, dst, kind = route['from'], route['to'], route['kind']
                  if src not in airports or dst not in airports or kind not in ('pax', 'cargo'):
                      raise RuntimeError(f'Invalid route: {src}-{dst}-{kind}')
                  a, b = airports[src], airports[dst]
                  distance, sec = geometry(a, b)
                  _, ret_sec = geometry(b, a)
                  outbound = a[kind]['sectors'][sec]
                  backhaul = b[kind]['sectors'][ret_sec]
                  new_routes.append({
                      'from': src, 'to': dst, 'kind': kind,
                      'sec': sec, 'nm': distance,
                      'out_w': math.ceil(outbound['c'] / 4),
                      'out_b': outbound['b'],
                      'back_w': math.ceil(backhaul['c'] / 4),
                  })
              return new_routes

          if not SNAP.is_file():
              raise RuntimeError('snapshot.json is missing')
          original_bytes = SNAP.read_bytes()
          original = json.loads(original_bytes)
          old_airports = original['airports']
          old_routes = original['routes']
          catalog = {a['icao']: a for a in old_airports}
          if len(catalog) != len(old_airports) or not catalog:
              raise RuntimeError('Invalid airport catalog')
          probe = 'UKBB' if 'UKBB' in catalog else sorted(catalog)[0]
          print(f'Checking API with {probe}', flush=True)
          payload, limits = get_probe(probe)
          results = {probe: convert(probe, payload, catalog[probe])}
          remaining, reset, limit = limits
          queue = sorted(set(catalog) - {probe})
          stale = {}
          print(f'Authenticated. Processing {len(catalog)} airports with {WORKERS} workers. Quota {remaining}/{limit}', flush=True)

          with concurrent.futures.ThreadPoolExecutor(max_workers=WORKERS) as pool:
              while queue:
                  if remaining <= 1:
                      wait_until(reset)
                      payload, limits = get_probe(probe)
                      results[probe] = convert(probe, payload, catalog[probe])
                      remaining, reset, limit = limits
                      continue
                  n = min(len(queue), remaining - 1)
                  batch, queue = queue[:n], queue[n:]
                  futures = {pool.submit(request_airport, icao): icao for icao in batch}
                  seen = []
                  limited = []
                  for future in concurrent.futures.as_completed(futures):
                      icao = futures[future]
                      status, raw, limits_out, message = future.result()
                      if limits_out:
                          seen.append(limits_out)
                      if status == 'ok':
                          results[icao] = convert(icao, raw, catalog[icao])
                      elif status == 'limited':
                          limited.append(icao)
                      else:
                          stale[icao] = message
                          results[icao] = retained(catalog[icao], icao)
                          print(f'{icao}: {message}; keeping previous values', flush=True)
                          if len(stale) > MAX_STALE:
                              raise RuntimeError(f'Too many unavailable airports ({len(stale)}); snapshots unchanged')
                  if seen:
                      latest_reset = max(q[1] for q in seen)
                      latest = [q for q in seen if q[1] == latest_reset]
                      if latest_reset > reset:
                          reset = latest_reset
                          remaining = min(q[0] for q in latest)
                          limit = min(q[2] for q in latest)
                      else:
                          remaining = min(max(0, remaining - n), min(q[0] for q in latest))
                  else:
                      remaining = max(0, remaining - n)
                  if limited:
                      queue = limited + queue
                      remaining = 0
                  print(f'{len(results)}/{len(catalog)} airports; quota {remaining}/{limit}; pending {len(queue)}', flush=True)

          if len(results) != len(catalog):
              raise RuntimeError('Incomplete airport collection')
          updated = {
              'generated_at': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              'airports': [results[a['icao']] for a in old_airports],
              'routes': build_routes(old_routes, results),
          }
          new_bytes = (json.dumps(updated, ensure_ascii=False, separators=(',', ':'), allow_nan=False) + '\n').encode('utf-8')
          PREV.write_bytes(original_bytes)
          SNAP.write_bytes(new_bytes)
          print(f'Ready: {len(results)} airports, {len(updated["routes"])} routes. Stale airports: {sorted(stale)}', flush=True)
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot.json snapshot_prev.json
          if ! git diff --cached --quiet; then
            git commit -m "Traffic"
            git push
          fi
