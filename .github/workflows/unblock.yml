
name: Unblock Pages

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/osasich/demand/pages/deployments/c79bfe90e090a801a8379a939101be94faea83c0/cancel
